
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Tripla Chance - Comprar Título</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

body {
  background: #fff;
}

.oferta-tripla {
  width: 100%;
  height: 100vh;
  height: 100dvh;
  padding: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  overflow: hidden;
}

.imagem-tripla {
  display: block;
  width: 100%;
  max-width: 500px;
  flex: 1 1 auto;
  min-height: 0;
  object-fit: contain;
  border-radius: 12px;
}

.botao-whatsapp {
  display: block;
  flex: 0 0 auto;
  width: 100%;
  max-width: 500px;
  padding: 16px 8px;
  background: #25D366;
  color: #fff;
  text-decoration: none;
  text-align: center;
  font-size: clamp(13px, 4vw, 17px);
  font-weight: 800;
  border: 0;
  border-radius: 12px;
  box-shadow: 0 4px 10px #0003;
  cursor: pointer;
  animation: pulsar 1.5s infinite;
}

.botao-whatsapp:hover {
  background: #1DA851;
}

@keyframes pulsar {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.02); }
}

/* MODAL */
.modal-cliente {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 99999;
  padding: 16px;
  background: rgba(0, 0, 0, 0.78);
  align-items: center;
  justify-content: center;
  overflow-y: auto;
}

.modal-cliente.aberto {
  display: flex;
}

.caixa-modal {
  position: relative;
  width: 100%;
  max-width: 400px;
  max-height: calc(100dvh - 32px);
  overflow-y: auto;
  padding: 24px 20px;
  background: #fff;
  color: #222;
  border-radius: 16px;
  box-shadow: 0 10px 40px #0005;
}

.caixa-modal h2 {
  margin: 0 28px 10px 0;
  font-size: 23px;
}

.caixa-modal p {
  color: #555;
  font-size: 14px;
  line-height: 1.5;
}

.fechar-modal {
  position: absolute;
  top: 8px;
  right: 12px;
  width: 36px;
  height: 36px;
  border: none;
  background: transparent;
  color: #444;
  font-size: 30px;
  cursor: pointer;
}

.caixa-modal label {
  display: block;
  margin-top: 16px;
  margin-bottom: 6px;
  font-size: 14px;
  font-weight: bold;
}

.caixa-modal input {
  display: block;
  width: 100%;
  min-height: 46px;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 9px;
  font-size: 16px;
  outline-color: #25D366;
}

.caixa-modal small {
  display: block;
  margin-top: 6px;
  color: #666;
}

.btn-continuar {
  width: 100%;
  margin-top: 22px;
  padding: 15px 10px;
  border: none;
  border-radius: 10px;
  background: #25D366;
  color: #fff;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.btn-continuar:hover {
  background: #1DA851;
}

.aviso-privacidade {
  font-size: 12px !important;
  color: #666 !important;
}

@media (max-height: 500px) {
  .caixa-modal {
    padding: 16px;
  }

  .caixa-modal label {
    margin-top: 10px;
  }

  .btn-continuar {
    margin-top: 14px;
  }
}
</style>
</head>

<body>

<!-- PÁGINA PRINCIPAL -->
<main class="oferta-tripla">

  <img
    src="https://res.cloudinary.com/dtw3turzb/image/upload/v1792159602/bahiasorte.webp"
    alt="Promoção Tripla Chance"
    class="imagem-tripla"
  >

  <button
    type="button"
    id="botaoWhatsApp"
    class="botao-whatsapp"
  >
    🟢 COMPRAR AGORA PELO WHATSAPP
  </button>

</main>

<!-- MODAL DE DADOS -->
<div
  id="modalCliente"
  class="modal-cliente"
  role="dialog"
  aria-modal="true"
  aria-labelledby="tituloModal"
>
  <div class="caixa-modal">

    <button
      type="button"
      id="fecharModal"
      class="fechar-modal"
      aria-label="Fechar"
    >&times;</button>

    <h2 id="tituloModal">🟢 Finalizar compra</h2>

    <p>
      Informe seus dados para continuar o atendimento pelo WhatsApp.
    </p>

    <form id="formCliente">

      <label for="cpfCliente">CPF (opcional)</label>

      <input
        type="text"
        id="cpfCliente"
        placeholder="000.000.000-00"
        maxlength="14"
        inputmode="numeric"
        autocomplete="off"
      >

      <label for="telefoneCliente">
        Telefone com DDD <span style="color:#d00">*</span>
      </label>

      <input
        type="tel"
        id="telefoneCliente"
        placeholder="(71) 99999-9999"
        maxlength="15"
        inputmode="numeric"
        autocomplete="tel"
        required
      >

      <small>Preencha o telefone para continuar.</small>

      <button type="submit" class="btn-continuar">
        FINALIZAR COMPRAR
      </button>

      <p class="aviso-privacidade">
        Os dados preenchidos serão incluídos na mensagem enviada
        ao WhatsApp. Este código não salva os dados em um banco.
      </p>

    </form>
  </div>
</div>

<script>
"use strict";

/* CONFIGURAÇÃO DO WHATSAPP */
const numeroWhatsAppDestino = "55719922990058";

const mensagemInicial =
  "Olá! Quero comprar meu título da Tripla Chance por R$ 5,00. Como faço para participar?";

/* ELEMENTOS */
const botaoCompra = document.getElementById("botaoWhatsApp");
const modalCliente = document.getElementById("modalCliente");
const fecharModalBtn = document.getElementById("fecharModal");
const formCliente = document.getElementById("formCliente");
const telefoneInput = document.getElementById("telefoneCliente");
const cpfInput = document.getElementById("cpfCliente");

/* ABRIR MODAL */
botaoCompra.addEventListener("click", function () {
  modalCliente.classList.add("aberto");
  telefoneInput.focus();
});

/* FECHAR MODAL */
function fecharModal() {
  modalCliente.classList.remove("aberto");
  botaoCompra.focus();
}

fecharModalBtn.addEventListener("click", fecharModal);

/* FECHAR AO CLICAR FORA DA CAIXA */
modalCliente.addEventListener("click", function (event) {
  if (event.target === modalCliente) {
    fecharModal();
  }
});

/* FECHAR COM ESC */
document.addEventListener("keydown", function (event) {
  if (event.key === "Escape" && modalCliente.classList.contains("aberto")) {
    fecharModal();
  }
});

/* MÁSCARA DE TELEFONE */
telefoneInput.addEventListener("input", function () {
  let numeros = this.value.replace(/\D/g, "").slice(0, 11);

  if (numeros.length > 10) {
    this.value = numeros.replace(
      /^(\d{2})(\d{5})(\d{0,4})$/,
      "($1) $2-$3"
    );
  } else if (numeros.length > 6) {
    this.value = numeros.replace(
      /^(\d{2})(\d{4})(\d{0,4})$/,
      "($1) $2-$3"
    );
  } else if (numeros.length > 2) {
    this.value = numeros.replace(
      /^(\d{2})(\d*)$/,
      "($1) $2"
    );
  } else if (numeros.length > 0) {
    this.value = "(" + numeros;
  }
});

/* MÁSCARA DE CPF */
cpfInput.addEventListener("input", function () {
  let numeros = this.value.replace(/\D/g, "").slice(0, 11);

  if (numeros.length > 9) {
    numeros = numeros.replace(
      /^(\d{3})(\d{3})(\d{3})(\d{0,2})$/,
      "$1.$2.$3-$4"
    );
  } else if (numeros.length > 6) {
    numeros = numeros.replace(
      /^(\d{3})(\d{3})(\d{0,3})$/,
      "$1.$2.$3"
    );
  } else if (numeros.length > 3) {
    numeros = numeros.replace(
      /^(\d{3})(\d{0,3})$/,
      "$1.$2"
    );
  }

  this.value = numeros;
});

/* VALIDAR E ABRIR WHATSAPP */
formCliente.addEventListener("submit", function (event) {
  event.preventDefault();

  const telefone = telefoneInput.value.replace(/\D/g, "");
  const cpf = cpfInput.value.replace(/\D/g, "");

  if (telefone.length < 10 || telefone.length > 11) {
    alert("Informe um telefone válido com DDD.");
    telefoneInput.focus();
    return;
  }

  if (cpf.length > 0 && cpf.length !== 11) {
    alert("O CPF deve conter 11 números ou ficar vazio.");
    cpfInput.focus();
    return;
  }

  let mensagem = mensagemInicial;

  mensagem += "\nTelefone informado: " + telefoneInput.value;

  if (cpf.length > 0) {
    mensagem += "\nCPF informado: " + cpfInput.value;
  }

  const link =
    "https://wa.me/" +
    numeroWhatsAppDestino +
    "?text=" +
    encodeURIComponent(mensagem);

  /* Abre a conversa em nova aba/janela */
  const novaJanela = window.open(link, "_blank");

  /* Alternativa para navegadores que bloqueiam pop-ups */
  if (!novaJanela) {
    window.location.href = link;
  }

  fecharModal();
});
</script>

</body>
</html>
