
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gerador Pix</title>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f2f5f9;
    color: #222;
    padding: 20px;
}

.container {
    max-width: 420px;
    margin: 30px auto;
    background: white;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 5px 25px #00000012;
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.logo {
    font-size: 30px;
    color: #00a86b;
    font-weight: bold;
}

.header p {
    color: #777;
    margin-top: 8px;
}

label {
    display: block;
    font-weight: bold;
    margin: 15px 0 8px;
}

input, textarea {
    width: 100%;
    padding: 14px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
}

input:focus, textarea:focus {
    border-color: #00a86b;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.btn-gerar {
    background: #00a86b;
    color: white;
}

.btn-copiar {
    background: #111;
    color: white;
}

.resultado {
    display: none;
    margin-top: 25px;
    text-align: center;
}

.valor {
    font-size: 27px;
    font-weight: bold;
    margin: 15px 0;
}

#qrcode {
    display: flex;
    justify-content: center;
    padding: 15px 0;
}

#qrcode img, #qrcode canvas {
    max-width: 100%;
    height: auto;
}

textarea {
    min-height: 110px;
    font-size: 12px;
    resize: vertical;
}

.mensagem {
    margin-top: 15px;
    padding: 12px;
    background: #e8f8ef;
    color: #087443;
    border-radius: 9px;
    text-align: center;
    display: none;
}

.aviso {
    color: #777;
    font-size: 12px;
    line-height: 1.5;
    margin-top: 18px;
    text-align: center;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">PIX</div>
        <h2>Gerador de Pix</h2>
        <p>Digite o valor e gere seu QR Code</p>
    </div>

    <form id="formPix">
        <label for="valor">Valor do Pix (R$)</label>

        <input
            id="valor"
            type="number"
            min="0.01"
            max="999999.99"
            step="0.01"
            placeholder="Ex.: 50.00"
            inputmode="decimal"
            required
        >

        <button class="btn-gerar" type="submit">
            Gerar QR Code Pix
        </button>
    </form>

    <div id="resultado" class="resultado">

        <h3>Escaneie para pagar</h3>

        <div id="qrcode"></div>

        <div id="valorGerado" class="valor"></div>

        <label for="codigoPix">Pix Copia e Cola</label>

        <textarea id="codigoPix" readonly></textarea>

        <button
            type="button"
            class="btn-copiar"
            id="btnCopiar"
        >
            Copiar código Pix
        </button>
<button
    type="button"
    class="btn-whatsapp"
    id="btnWhatsApp"
>
    📲 Compartilhar pelo WhatsApp
</button>
    </div>

    <div id="mensagem" class="mensagem"></div>

    <p class="aviso">
        Confira o nome do beneficiário no aplicativo do seu banco
        antes de confirmar o pagamento. Esta página não confirma
        automaticamente o recebimento.
    </p>

</div>

<script>
"use strict";

/* DADOS DO RECEBEDOR */
const PIX_CHAVE = "02562631595";
const PIX_NOME = "CARLOS DOS SANTOS REIS";
const PIX_CIDADE = "SALVADOR";

/* ELEMENTOS */
const form = document.getElementById("formPix");
const campoValor = document.getElementById("valor");
const resultado = document.getElementById("resultado");
const qrContainer = document.getElementById("qrcode");
const codigoPix = document.getElementById("codigoPix");
const valorGerado = document.getElementById("valorGerado");
const mensagem = document.getElementById("mensagem");

/* MENSAGEM */
function avisar(texto) {
    mensagem.textContent = texto;
    mensagem.style.display = "block";
}

/* REMOVER ACENTOS */
function removerAcentos(texto) {
    return String(texto)
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
}

/* CAMPO EMV DO PIX */
function campoPix(id, valor) {
    valor = String(valor);

    return id +
        String(valor.length).padStart(2, "0") +
        valor;
}

/* CRC16 */
function crc16(texto) {
    let crc = 0xFFFF;

    for (let i = 0; i < texto.length; i++) {
        crc ^= texto.charCodeAt(i) << 8;

        for (let j = 0; j < 8; j++) {
            if (crc & 0x8000) {
                crc = (crc << 1) ^ 0x1021;
            } else {
                crc <<= 1;
            }

            crc &= 0xFFFF;
        }
    }

    return crc.toString(16)
        .toUpperCase()
        .padStart(4, "0");
}

/* MONTAR PIX COPIA E COLA */
function criarPix(valor) {
    const nome = removerAcentos(PIX_NOME)
        .substring(0, 25)
        .toUpperCase();

    const cidade = removerAcentos(PIX_CIDADE)
        .substring(0, 15)
        .toUpperCase();

    const contaPix =
        campoPix("00", "BR.GOV.BCB.PIX") +
        campoPix("01", PIX_CHAVE);

    let payload = campoPix("00", "01");

    payload += campoPix("26", contaPix);
    payload += campoPix("52", "0000");
    payload += campoPix("53", "986");
    payload += campoPix("54", valor.toFixed(2));
    payload += campoPix("58", "BR");
    payload += campoPix("59", nome);
    payload += campoPix("60", cidade);

    /* Identificador de transação estático */
    payload += campoPix(
        "62",
        campoPix("05", "***")
    );

    const semCRC = payload + "6304";

    return semCRC + crc16(semCRC);
}

/* GERAR QR CODE */
form.addEventListener("submit", function(event) {
    event.preventDefault();

    const valor = Number(campoValor.value);

    if (!Number.isFinite(valor) ||
        valor < 0.01 ||
        valor > 999999.99) {
        avisar("Digite um valor entre R$ 0,01 e R$ 999.999,99.");
        return;
    }

    if (typeof QRCode === "undefined") {
        avisar("Não foi possível carregar o gerador de QR Code. Verifique sua conexão.");
        return;
    }

    const payload = criarPix(valor);

    codigoPix.value = payload;

    valorGerado.textContent = valor.toLocaleString(
        "pt-BR",
        { style: "currency", currency: "BRL" }
    );

    qrContainer.innerHTML = "";

    new QRCode(qrContainer, {
        text: payload,
        width: 230,
        height: 230,
        correctLevel: QRCode.CorrectLevel.M
    });

    resultado.style.display = "block";
    mensagem.style.display = "none";
});

/* COPIAR PIX */
document.getElementById("btnCopiar")
.addEventListener("click", async function() {
    try {
        await navigator.clipboard.writeText(codigoPix.value);
        avisar("Código Pix copiado!");
    } catch (error) {
        codigoPix.focus();
        codigoPix.select();

        const sucesso = document.execCommand("copy");

        avisar(
            sucesso
                ? "Código Pix copiado!"
                : "Selecione o código e copie manualmente."
        );
    }
});
/* COMPARTILHAR PIX PELO WHATSAPP */
document.getElementById("btnWhatsApp")
.addEventListener("click", function() {

    if (!codigoPix.value) {
        avisar("Gere o Pix primeiro!");
        return;
    }

    const valor = Number(campoValor.value);

    const valorFormatado = valor.toLocaleString(
        "pt-BR",
        {
            style: "currency",
            currency: "BRL"
        }
    );

    const texto =
        "Olá! Seguem os dados para pagamento via Pix.\n\n" +
        "💰 Valor: " + valorFormatado + "\n\n" +
        "👤 Recebedor: " + PIX_NOME + "\n\n" +
        
        "📋 PIX COPIA E COLA:\n\n" +
        codigoPix.value + "\n\n" +
        "Copie o código acima e cole na opção Pix Copia e Cola do seu banco.";

    const url =
        "https://wa.me/?text=" +
        encodeURIComponent(texto);

    window.open(url, "_blank");
});
</script>

</body>
</html>
